<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Furniture pilot loading</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#aeb9ae;color:#fff;font:14px system-ui}
    canvas{display:block;width:100%;height:100%}
    pre{position:fixed;left:12px;bottom:12px;max-width:min(760px,92vw);max-height:36vh;overflow:auto;margin:0;padding:12px;border-radius:8px;background:#101612df;white-space:pre-wrap}
  </style>
  <script type="importmap">{"imports":{"three":"../shared/vendor/three.module.js","three/addons/":"../shared/vendor/addons/"}}</script>
</head>
<body>
  <pre id="audit">LOADING</pre>
  <script type="module">
    import * as THREE from '../shared/vendor/three.module.js';
    import { GLTFLoader } from '../shared/vendor/addons/loaders/GLTFLoader.js';
    import { installLiveFurniturePilot } from '../shared/live-furniture-pilot.js';

    const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(1);
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.05;
    document.body.prepend(renderer.domElement);
    const scene=new THREE.Scene();scene.background=new THREE.Color(0xaeb9ae);
    const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.02,160);
    const params=new URLSearchParams(location.search);
    const mainModelMode=params.get('main')==='1';
    const harnessView=params.get('view')||'living';
    if(mainModelMode&&harnessView==='upper'){camera.position.set(-7.834,4.3,7.915);camera.lookAt(-7.724,3.6,9.534);}
    else if(mainModelMode){camera.position.set(-7.465,1.58,5.19);camera.lookAt(-5.459,.92,8.133);}
    else{camera.position.set(6.3,3.6,-3.1);camera.lookAt(2.5,.55,-7.18);}
    scene.add(new THREE.HemisphereLight(0xf6fff2,0x4f493e,2.2));
    const sun=new THREE.DirectionalLight(0xfff1d7,4.1);sun.position.set(-7,13,-5);sun.castShadow=true;scene.add(sun);

    const audit=document.querySelector('#audit');
    function load(url){return new Promise((resolve,reject)=>new GLTFLoader().load(url,g=>resolve(g.scene),undefined,reject));}
    try{
      // A metric house-reference fixture keeps the browser harness independent
      // from the 22 MB architecture GLB while still testing every furniture
      // request, transform, per-family handover and fallback name matcher.
      let house;
      if(mainModelMode){
        house=await load('../shared/Chamagnieu_V18_WEB_REALISM_UPGRADED.glb?test=furniture-pilot-main');
      }else{
        house=new THREE.Group();house.name='HARNESS_HOUSE';
        const anchor=new THREE.Group();anchor.name='HOUSE_REFERENCE_ORIGIN';house.add(anchor);
        for(const name of [
          'V11_LIVING_SOFA',
          'V12_DINING_TABLE_LEG_1','V12_DINING_TABLE_LEG_2','V12_DINING_TABLE_LEG_3','V12_DINING_TABLE_LEG_4','V12_DINING_TABLE_TOP',
          ...Array.from({length:6},(_,i)=>`V11_DINING_CHAIR_${String(i+1).padStart(2,'0')}`),
          ...[1,2,3].flatMap(room=>['BASE','DUVET','HEAD','LEG_0','LEG_1','LEG_2','LEG_3','MATTRESS','PILLOW_0','PILLOW_1'].map(part=>`V11_BEDROOM${room}_BED_${part}`))
        ]){const node=new THREE.Group();node.name=name;anchor.add(node);}
      }
      scene.add(house);
      if(!mainModelMode){
        const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,8),new THREE.MeshStandardMaterial({color:0x8f8a7b,roughness:.9}));
        floor.rotation.x=-Math.PI/2;floor.position.set(2.5,0,-7.2);floor.receiveShadow=true;scene.add(floor);
      }
      const result=await installLiveFurniturePilot({scene,house,renderer,cacheKey:'harness-1',timeoutMs:60000});
      window.__viewerReady=true;
      document.documentElement.dataset.viewerReady='true';
      document.documentElement.dataset.furniturePilot=result.status;
      audit.textContent=JSON.stringify(result,null,2);
      document.title=`Furniture pilot ${result.status}`;
    }catch(error){
      window.__viewerFailed=true;
      document.documentElement.dataset.viewerReady='failed';
      audit.textContent=JSON.stringify({status:'failed',error:error?.message||String(error)},null,2);
      document.title='Furniture pilot failed';
    }
    renderer.setAnimationLoop(()=>renderer.render(scene,camera));
  </script>
</body>
</html>
