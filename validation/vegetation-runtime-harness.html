<div id="audit">loading</div>
<script type="module">
import * as THREE from '../shared/vendor/three.module.js';
import { installLiveVegetation } from '../shared/live-vegetation.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xb8c5bb);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100); camera.position.set(10,7,13); camera.lookAt(0,2,0);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.body.prepend(renderer.domElement);

  // Headless Chromium throttles requestAnimationFrame for background pages.
  // Measure deterministic main-thread frame submission. The full viewer's
  // live validator supplies the separate wall-clock FPS gate on a GPU-backed
  // browser; SwiftShader's software rasterizer is not a hardware FPS proxy.
  const start=performance.now();
  for(let frame=0;frame<count;frame+=1) renderer.render(scene,camera);
  const elapsedMs=Math.max(1,performance.now()-start);

window.__done=true; document.querySelector('#audit').textContent=JSON.stringify(audit,null,2); renderer.render(scene,camera);
</script>
